# 此 workflow 负责：
#   1. 在 push / PR 时进行构建与测试（CI）
#   2. 在推送 v* tag 时触发 GoReleaser 自动交叉编译并发布 GitHub Release

name: Go

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------- CI：构建与测试 ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
          cache: true

      - name: Get dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  # ---------- Release：打 tag 时发布 ----------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # GoReleaser 需要写入权限以创建 Release 与资产
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser 需要完整历史生成 changelog

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
